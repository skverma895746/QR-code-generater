<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REC Bijnor - 3D Campus Tour QR Generator</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* MAIN CARD CONTAINER WITH AI CAMPUS BACKGROUND */
        .container {
            width: 100%;
            max-width: 680px;
            /* AI Campus Image as Background inside Card */
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        /* LEFT SIDE: Input & Button */
        .leftSide {
            width: 50%;
            padding: clamp(1.5rem, 4vw, 2.5rem) 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leftSide h2 {
            color: #818cf8;
            font-size: clamp(1.2rem, 3vw, 1.4rem);
            font-weight: 700;
        }

        .leftSide p {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .container input {
            width: 100%;
            height: 44px;
            padding: 10px 14px;
            outline: 0;
            border: 1.5px solid rgba(129, 140, 248, 0.5);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .container input::placeholder {
            color: #64748b;
        }

        .container input:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }

        .container button {
            width: 100%;
            height: 44px;
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .container button:hover {
            background-color: #4f46e5;
            transform: translateY(-1px);
        }

        /* RIGHT SIDE: Header + QR Display */
        .rightSide {
            width: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(1.5rem, 4vw, 2.2rem) 1.5rem;
            text-align: center;
        }

        /* REC Bijnor Heading on top of QR Box */
        .qr-header {
            margin-bottom: 1.2rem;
        }

        .qr-header h3 {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .qr-header h3 i {
            color: #818cf8;
        }

        .qr-header p {
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.2rem;
        }

        .qrBox {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
        }

        .qrBox img {
            max-width: 100%;
            width: 170px;
            height: 170px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: #ffffff;
            padding: 8px;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .qrPlaceholder {
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 2rem 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            width: 100%;
            max-width: 170px;
        }

        .btn-download {
            display: none;
            font-size: 0.8rem;
            padding: 0.5rem 0.9rem;
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: rgba(129, 140, 248, 0.3);
            color: #ffffff;
        }

        /* Error Effect */
        .error {
            border-color: #ef4444 !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Responsive Mobile Layout */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                max-width: 420px;
            }

            .leftSide,
            .rightSide {
                width: 100%;
            }

            .leftSide {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>

<body>

    <!-- CARD WITH CAMPUS BACKGROUND -->
    <div class="container">
        <!-- LEFT SIDE: Form Inputs -->
        <div class="leftSide">
            <h2>QR Code Generator</h2>
            <p>Text ya URL likho aur QR code banao</p>
            <input type="text" id="qrText" placeholder="Text or Url" value="https://recb.ac.in">
            <button onclick="qrGenerate()">
                <span>Generate</span>
                <i class="fa-solid fa-qrcode"></i>
            </button>
        </div>

        <!-- RIGHT SIDE: REC Bijnor Title On Top + QR Display -->
        <div class="rightSide">
            <!-- REC Bijnor Heading -->
            <div class="qr-header">
                <h3><i class="fa-solid fa-graduation-cap"></i> REC Bijnor</h3>
                <p>3D Campus Tour</p>
            </div>

            <div class="qrBox">
                <span class="qrPlaceholder" id="placeholder">Aapka QR code yahan dikhega</span>
                <img src="" alt="REC Bijnor QR Code" id="qrImg">
                <button class="btn-download" id="downloadBtn" onclick="downloadQR()">
                    <i class="fa-solid fa-download"></i> Download
                </button>
            </div>
        </div>
    </div>

    <script>
        const qrText = document.querySelector("#qrText");
        const qrImg = document.querySelector("#qrImg");
        const placeholder = document.querySelector("#placeholder");
        const downloadBtn = document.querySelector("#downloadBtn");

        function qrGenerate() {
            if (qrText.value.trim().length > 0) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrText.value.trim())}`;
                placeholder.style.display = "none";
                qrImg.style.display = "block";
                downloadBtn.style.display = "inline-flex";
            } else {
                qrText.classList.add("error");
                setTimeout(() => {
                    qrText.classList.remove("error");
                }, 500);
            }
        }

        async function downloadQR() {
            try {
                const response = await fetch(qrImg.src);
                const blob = await response.blob();
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "RECBijnor_3D_Tour_QR.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert("Download mein dikkat aayi, dobara try karein.");
            }
        }
    </script>
</body>

</html>
