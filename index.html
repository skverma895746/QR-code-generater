    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECB 3D Campus Tour - QR Generator</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            /* AI Generated 3D Campus Style Background Image */
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* Top Campus Banner */
        .campus-header {
            text-align: center;
            color: #ffffff;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .campus-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .campus-header p {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* LEFT PANEL */
        .leftSide {
            width: 55%;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.25rem;
        }

        .section-title {
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            color: var(--primary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 1rem 0 2.75rem;
            outline: none;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.2s ease;
            background: #fff;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .btn-generate {
            width: 100%;
            height: 50px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-generate:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* RIGHT PANEL */
        .rightSide {
            width: 45%;
            background-color: #f8fafc;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .qrBox {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
        }

        .qr-header-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .img-container {
            width: 200px;
            height: 200px;
            border-radius: 16px;
            background: #fff;
            padding: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qrBox img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: none;
        }

        .qrPlaceholder {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .qrPlaceholder i {
            font-size: 2.5rem;
            color: #cbd5e1;
        }

        .actions {
            display: flex;
            width: 100%;
            max-width: 200px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .actions.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-action {
            width: 100%;
            padding: 0.65rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-action:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .spinner {
            display: none;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--danger) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @media (max-width: 680px) {
            .container {
                flex-direction: column;
            }

            .leftSide,
            .rightSide {
                width: 100%;
            }

            .rightSide {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>

    <!-- TOP HEADER -->
    <div class="campus-header">
        <h1><i class="fa-solid fa-cube"></i> RECB 3D Campus Tour</h1>
        <p>Scan to explore the Rajkiya Engineering College Banda Virtual Tour</p>
    </div>

    <!-- MAIN GENERATOR CONTAINER -->
    <div class="container">
        <!-- Left Side -->
        <div class="leftSide">
            <div class="section-title">
                <i class="fa-solid fa-qrcode"></i>
                <span>Generate Campus QR</span>
            </div>
            
            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="qrText" placeholder="Enter Tour Link or Room URL..." value="https://recb.ac.in" autocomplete="off">
                    <i class="fa-solid fa-link"></i>
                </div>
            </div>

            <button class="btn-generate" onclick="qrGenerate()">
                <span>Generate Tour QR</span>
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <!-- Right Side -->
        <div class="rightSide">
            <div class="qrBox">
                <div class="qr-header-tag">
                    <i class="fa-solid fa-vr-cardboard"></i> RECB 3D Tour
                </div>

                <div class="img-container">
                    <div class="spinner" id="loader"></div>
                    <div class="qrPlaceholder" id="placeholder">
                        <i class="fa-solid fa-qrcode"></i>
                        <span>Click Generate to view QR</span>
                    </div>
                    <img src="" alt="RECB Campus QR Code" id="qrImg">
                </div>

                <div class="actions" id="actionBtns">
                    <button class="btn-action" onclick="downloadQR()">
                        <i class="fa-solid fa-download"></i> Download QR Code
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const qrText = document.querySelector("#qrText");
        const qrImg = document.querySelector("#qrImg");
        const placeholder = document.querySelector("#placeholder");
        const loader = document.querySelector("#loader");
        const actionBtns = document.querySelector("#actionBtns");

        qrText.addEventListener("keyup", (e) => {
            if (e.key === "Enter") qrGenerate();
        });

        function qrGenerate() {
            const val = qrText.value.trim();

            if (val.length > 0) {
                placeholder.style.display = "none";
                qrImg.style.display = "none";
                loader.style.display = "block";
                actionBtns.classList.remove("active");

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(val)}`;
                qrImg.src = qrUrl;

                qrImg.onload = () => {
                    loader.style.display = "none";
                    qrImg.style.display = "block";
                    actionBtns.classList.add("active");
                };
            } else {
                qrText.classList.add("error");
                setTimeout(() => qrText.classList.remove("error"), 500);
            }
        }

        async function downloadQR() {
            try {
                const response = await fetch(qrImg.src);
                const blob = await response.blob();
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "RECB_3D_Campus_QR.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert("Download error, please try again!");
            }
        }
    </script>
</body>

</html>
