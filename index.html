<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECB 3D Campus Tour</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            /* AI Generated Campus Style Background */
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* TOP HEADING BANNER */
        .top-banner {
            text-align: center;
            color: #ffffff;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 640px;
        }

        .top-banner h1 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .top-banner p {
            color: #cbd5e1;
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            margin-top: 0.3rem;
            font-weight: 500;
        }

        /* MAIN CONTAINER (Same structure as original) */
        .container {
            width: 100%;
            max-width: 640px;
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* LEFT SIDE: input + button (Original Placement) */
        .leftSide {
            width: 50%;
            padding: clamp(1.25rem, 3vw, 2rem) 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.85rem;
        }

        .leftSide h2 {
            color: #4f46e5;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            font-weight: 700;
        }

        .leftSide p {
            color: #64748b;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .container input {
            width: 100%;
            height: 42px;
            padding: 10px 12px;
            outline: 0;
            border: 1px solid #4f46e5;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .container input:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .container button {
            width: 100%;
            height: 42px;
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .container button:hover {
            background-color: #4338ca;
        }

        /* RIGHT SIDE: QR code display (Original Placement) */
        .rightSide {
            width: 50%;
            background-color: #f8fafc;
            border-left: 1px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1.25rem, 3vw, 1.5rem);
        }

        .qrBox {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .qrBox img {
            max-width: 100%;
            max-height: 180px;
            height: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            padding: 8px;
            display: none;
        }

        .qrPlaceholder {
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.4;
        }

        .btn-download {
            display: none;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            background: #e0e7ff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #c7d2fe;
        }

        /* Error Shake Effect */
        .error {
            border-color: #ef4444 !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Mobile Responsive (Vertical Stack) */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                width: 100%;
            }

            .leftSide,
            .rightSide {
                width: 100%;
            }

            .rightSide {
                border-left: none;
                border-top: 1px dashed #cbd5e1;
            }
        }
    </style>
</head>

<body>

    <!-- TOP HEADING -->
    <div class="top-banner">
        <h1><i class="fa-solid fa-cube"></i> RECB 3D Campus Tour</h1>
        <p>Text ya Link daalein aur Campus Tour QR Code banayein</p>
    </div>

    <!-- ORIGINAL CONTAINER STRUCTURE -->
    <div class="container">
        <!-- LEFT SIDE: Input & Button -->
        <div class="leftSide">
            <h2>QR Code Generator</h2>
            <p>Text ya URL likho aur QR code banao</p>
            <input type="text" id="qrText" placeholder="Text or Url" value="https://recb.ac.in">
            <button onclick="qrGenerate()">
                <span>Generate</span>
                <i class="fa-solid fa-qrcode"></i>
            </button>
        </div>

        <!-- RIGHT SIDE: QR Display -->
        <div class="rightSide">
            <div class="qrBox">
                <span class="qrPlaceholder" id="placeholder">Aapka QR code yahan dikhega</span>
                <img src="" alt="QR Code" id="qrImg">
                <button class="btn-download" id="downloadBtn" onclick="downloadQR()">
                    <i class="fa-solid fa-download"></i> Download
                </button>
            </div>
        </div>
    </div>

    <script>
        const qrText = document.querySelector("#qrText");
        const qrImg = document.querySelector("#qrImg");
        const placeholder = document.querySelector("#placeholder");
        const downloadBtn = document.querySelector("#downloadBtn");

        function qrGenerate() {
            if (qrText.value.trim().length > 0) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrText.value.trim())}`;
                placeholder.style.display = "none";
                qrImg.style.display = "block";
                downloadBtn.style.display = "inline-flex";
            } else {
                qrText.classList.add("error");
                setTimeout(() => {
                    qrText.classList.remove("error");
                }, 500);
            }
        }

        async function downloadQR() {
            try {
                const response = await fetch(qrImg.src);
                const blob = await response.blob();
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "RECB_3D_Tour_QR.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert("Download mein dikkat aayi, dobara try karein.");
            }
        }
    </script>
</body>

</html>
